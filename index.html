<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOTOFFERHUB - Official Telegram Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2370533053800420');

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=2370533053800420&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        telegram: '#229ED9',
                        telegramHover: '#1D88BC',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080a0f;
            background-image: 
                radial-gradient(ellipse at 50% 25%, rgba(245, 158, 11, 0.14) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 80%, rgba(34, 158, 217, 0.10) 0%, transparent 70%);
        }
        
        .square-box {
            background: linear-gradient(145deg, #131926, #0e121b);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.12);
        }

        .pulse-effect {
            animation: pulse-glow 2.2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(34, 158, 217, 0.45);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 28px rgba(34, 158, 217, 0.85);
                transform: scale(1.015);
            }
        }

        .dark-shadow-title {
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-sm square-box rounded-3xl p-6 sm:p-8 text-center flex flex-col items-center justify-center transition-all duration-300 relative overflow-hidden">
        
        <!-- Verified Community Badge -->
        <div class="mb-4 inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold tracking-wide">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span>Official Community Channel</span>
        </div>

        <!-- LOOTOFFERHUB Logo Artwork (Policy-Safe Version) -->
        <div class="relative w-40 h-40 sm:w-44 sm:h-44 mb-4 rounded-2xl overflow-hidden border-2 border-amber-400/50 shadow-2xl bg-black flex items-center justify-center p-2">
            <svg viewBox="0 0 500 500" class="w-full h-full rounded-xl">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFE066"/>
                        <stop offset="50%" stop-color="#F59E0B"/>
                        <stop offset="100%" stop-color="#B45309"/>
                    </linearGradient>
                    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#DC2626"/>
                        <stop offset="100%" stop-color="#991B1B"/>
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Background Circle -->
                <circle cx="250" cy="250" r="235" fill="#0A0A0A" />
                <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)" />
                <circle cx="250" cy="250" r="210" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 6"/>

                <!-- Crown & Decorative Stars -->
                <path d="M 180 120 L 210 160 L 250 100 L 290 160 L 320 120 L 310 180 L 190 180 Z" fill="url(#goldGrad)" />
                <circle cx="180" cy="115" r="8" fill="#FFF" />
                <circle cx="250" cy="95" r="10" fill="#FFF" />
                <circle cx="320" cy="115" r="8" fill="#FFF" />
                
                <circle cx="130" cy="380" r="24" fill="url(#goldGrad)" />
                <text x="130" y="390" font-family="sans-serif" font-weight="900" font-size="28" fill="#78350F" text-anchor="middle">★</text>
                
                <circle cx="370" cy="380" r="24" fill="url(#goldGrad)" />
                <text x="370" y="390" font-family="sans-serif" font-weight="900" font-size="28" fill="#78350F" text-anchor="middle">★</text>

                <!-- Branding Typography -->
                <text x="250" y="210" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="65" fill="url(#goldGrad)" text-anchor="middle" stroke="#000" stroke-width="10" paint-order="stroke fill">LOOT</text>
                
                <rect x="70" y="225" width="360" height="65" rx="12" fill="#FFFFFF" stroke="#000" stroke-width="8" />
                <text x="250" y="274" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="50" fill="#0F172A" text-anchor="middle">OFFER</text>

                <path d="M 110 305 L 390 305 L 370 375 L 130 375 Z" fill="url(#redRibbon)" stroke="#000" stroke-width="6" />
                <text x="250" y="352" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle">HUB</text>
                
                <circle cx="250" cy="422" r="34" fill="url(#goldGrad)" stroke="#000" stroke-width="6" />
                <text x="250" y="434" font-family="sans-serif" font-weight="900" font-size="34" fill="#78350F" text-anchor="middle">✓</text>
            </svg>
        </div>

        <!-- Title & Clear Value Proposition -->
        <div class="mb-4">
            <h1 class="text-xl sm:text-2xl font-black text-white tracking-wider uppercase dark-shadow-title">
                LOOT<span class="text-amber-400">OFFER</span>HUB
            </h1>
            <p class="text-xs text-amber-300/90 font-bold tracking-widest mt-1 uppercase">
                DIGITAL DEALS & COMMUNITY
            </p>
        </div>

        <!-- Clear Channel Benefits -->
        <div class="w-full bg-slate-900/75 rounded-2xl p-3.5 border border-slate-800/90 mb-5 text-left space-y-2">
            <div class="flex items-center gap-2.5 text-xs text-slate-300 font-medium">
                <i class="fa-solid fa-tags text-amber-400 w-4 text-center"></i>
                <span>Exclusive Daily Deals & Price Drops</span>
            </div>
            <div class="flex items-center gap-2.5 text-xs text-slate-300 font-medium">
                <i class="fa-solid fa-users text-amber-400 w-4 text-center"></i>
                <span>Active Community Discussions</span>
            </div>
            <div class="flex items-center gap-2.5 text-xs text-slate-300 font-medium">
                <i class="fa-solid fa-bell text-amber-400 w-4 text-center"></i>
                <span>Instant Alert Notifications</span>
            </div>
        </div>

        <!-- Join Telegram CTA Button (User-Initiated Only) -->
        <a 
            id="tg-join-btn"
            href="https://t.me/+37kTniHfbCQ1OGNl"
            onclick="handleTelegramJoin(event)"
            class="w-full py-4 px-6 rounded-2xl font-black text-white bg-telegram hover:bg-telegramHover active:scale-95 transition-all duration-200 flex items-center justify-center gap-3 text-base sm:text-lg shadow-lg pulse-effect group cursor-pointer no-underline"
        >
            <i class="fa-brands fa-telegram text-2xl group-hover:scale-110 transition-transform"></i>
            <span id="btn-text">JOIN TELEGRAM CHANNEL</span>
        </a>

        <!-- Policy & Transparency Links -->
        <div class="mt-5 pt-3 border-t border-slate-800/80 w-full flex flex-col items-center gap-1.5">
            <div class="flex items-center justify-center gap-3 text-[11px] text-slate-400">
                <button type="button" onclick="toggleModal('privacy')" class="hover:text-amber-400 underline cursor-pointer">Privacy Policy</button>
                <span>•</span>
                <button type="button" onclick="toggleModal('terms')" class="hover:text-amber-400 underline cursor-pointer">Terms of Use</button>
            </div>
            <p class="text-[10px] text-slate-500 leading-relaxed mt-1">
                Informational community channel. Not affiliated with Meta Platforms, Inc. or Telegram.
            </p>
        </div>

    </main>

    <!-- Simple Policy Modal -->
    <div id="policy-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 text-left text-slate-300 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <h3 id="modal-title" class="text-sm font-bold text-white uppercase tracking-wider">Privacy Policy</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white text-lg cursor-pointer">&times;</button>
            </div>
            <p id="modal-body" class="text-xs text-slate-400 leading-relaxed mb-4"></p>
            <button type="button" onclick="closeModal()" class="w-full py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs cursor-pointer">Close</button>
        </div>
    </div>

    <script>
        const TELEGRAM_URL = "https://t.me/+37kTniHfbCQ1OGNl";
        let isRedirecting = false;

        function handleTelegramJoin(e) {
            e.preventDefault();
            if (isRedirecting) return;
            isRedirecting = true;

            const btnText = document.getElementById('btn-text');
            btnText.innerText = "OPENING TELEGRAM...";

            // Fire Meta Pixel Lead Event on genuine button click
            if (typeof fbq === 'function') {
                try {
                    fbq('track', 'Lead', {
                        content_name: 'LOOTOFFERHUB Telegram Join',
                        content_category: 'Community'
                    });
                } catch (err) {
                    console.error('Meta Pixel error:', err);
                }
            }

            // Short delay so pixel event finishes sending before navigation
            setTimeout(() => {
                window.location.href = TELEGRAM_URL;
            }, 250);
        }

        function toggleModal(type) {
            const modal = document.getElementById('policy-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            if (type === 'privacy') {
                title.innerText = "Privacy Policy";
                body.innerText = "We respect your privacy. This landing page uses standard analytics cookies (Meta Pixel) solely to measure ad performance. We do not collect, store, or sell your personal contact details on this page.";
            } else {
                title.innerText = "Terms of Use";
                body.innerText = "By clicking 'Join Telegram Channel', you voluntarily choose to visit our public Telegram community for informational updates and deals. Participation is completely free and optional.";
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('policy-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
